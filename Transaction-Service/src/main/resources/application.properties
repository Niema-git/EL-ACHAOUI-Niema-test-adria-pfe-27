spring.application.name=transaction-service
server.port=8082
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.enabled=false

spring.datasource.url=jdbc:h2:mem:transaction-db
spring.h2.console.enabled=true

# URL directe d'account-service (on passera par Eureka plus tard)
account-service.url=http://localhost:8081

# Règle métier : plafond configuré
transaction.max-amount=10000

spring.graphql.graphiql.enabled=true
spring.ai.mcp.server.protocol=streamable
spring.application.name=transaction-service
server.port=8082
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.enabled=false

spring.datasource.url=jdbc:h2:mem:transaction-db
spring.h2.console.enabled=true

# URL directe d'account-service (on passera par Eureka plus tard)
account-service.url=http://localhost:8081

# Règle métier : plafond configuré
transaction.max-amount=10000

spring.graphql.graphiql.enabled=true
spring.ai.mcp.server.protocol=streamable
# Resilience4J
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=5
resilience4j.circuitbreaker.instances.accountService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.accountService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.accountService.register-health-indicator=true
resilience4j.circuitbreaker.instances.accountService.ignore-exceptions=feign.FeignException$NotFound,feign.FeignException$UnprocessableEntity

management.endpoints.web.exposure.include=health,circuitbreakers
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always